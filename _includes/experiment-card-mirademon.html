{%- assign card = site.data.mirademon.cards.mirademon -%}
<article class="experiment-card experiment-card--mirademon h-100">
  <div class="experiment-card-inner">
    <h3 class="experiment-card-title">{{ card.title }}</h3>
    <p class="experiment-card-subtitle">{{ card.subtitle }}</p>
    <p class="experiment-card-desc">{{ card.description }}</p>
    <a href="{{ site.baseurl }}{{ card.url }}" class="experiment-card-cta">{{ card.cta }}</a>
  </div>
</article>
