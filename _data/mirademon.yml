# Interview — Ozorian Prophet (appears after hero, before manifesto)
interview:
  attribution: "Answering some question to Sara Fehrer from Ozora Team for the Ozorian Prophet"
  questions:
    - id: origin
      question: "How did you come up with the Sympathy for the Devil interactive exhibition?"
      blocks:
        - type: text
          content: "I read that Ozora was looking for totems to decorate certain places. </p> I thought about creating one — or even more than one — to leave around. </br>The initial idea was for them to be battery-powered, but with a few small electronic components that would allow them to interact with passersby: an eye that follows you, an exchange of some kind—first fear/awe, then discovery and recognition. </p> This brought to mind the concept of the demon from Asian tradition, which actually represents a part of ourselves that, once confronted, protects us. </br> It’s all very Jungian in its own way, and there’s a lot of psychedelia in this catharsis. </br> I made a few sketches on paper (strictly without using AI!) and submitted this one within the call’s guidelines. </p> Tibetan iconic demon Māra / bdud is the demon of obstruction: the force that attacks the mind at the threshold of awakening. It appears as fear, desire, anger, doubt, and illusion. It is not simply an external monster, but a projection of inner resistance. Māra is “defeated” not by violence, but by recognition, stillness, and awareness. By facing these figures, individuals are reminded to acknowledge and master their own destructive impulses. In this way, demons become protectors and teachers rather than purely malevolent entities."
        - type: image
          image: /assets/images/2026/call.png
          alt: Ozora call sketch — Sympathy for the Devil
        - type: image
          image: /assets/images/2026/early.png
          alt: Early Mirademon sketch
        - type: image
          image: /assets/images/2026/demon.png
          alt: Early Mirademon sketch
    - id: title
      question: "What does the title/concept express for you?"
      blocks:
        - type: text
          content: "The idea behind the concept of “Sympathy for the Devil” is to confront one’s destructive impulses—the experiences we may not be too proud of—and to accept them in order to become a better person. </br>I think this is one of the defining moments in human history and one of the great questions lying dormant behind the attempt to temporarily suppress our ego in search of a catharsis that allows us to live with our suffering. </br>I apologize if I sound too gloomy or even too deep—and perhaps a bit rhetorical! </br>The fact that the installation uses a local artificial intelligence model is in itself a very powerful symbol, both of how this technology is used in relation to us humans and on a purely visual level."
    - id: guests
      question: "What can guests expect?"
      blocks:
        - type: text
          content: "Viewers will see a kinetic statue, a sort of puppet (my father calls it “babachu (baˈbatʃu)” which in Piedmontese means “little toy,” or perhaps even “marionette”) made “in the style of” or inspired by Hindu and Buddhist traditions, with interactive elements that seek to create some kind of interaction with the audience. </p> At worst, it will be just eye contact. </p>A gesture (or a series of gestures) from the viewer can calm or soothe the demon, which will then return to rest and leave you alone. </p>There’s a lot to unpack here as well. There’s an issue of <b>cultural appropriation</b>. I want to make it clear that my team and I were motivated by a deep respect for the various cultures we drew upon, so I’ve emphasized three times that our intention was not to offend anyone! I remember a wonderful book by Eric Hobsbawm — The Invention of Tradition — in which he discussed how countless traditions and customs were created from scratch. </p> In this installation, this shrine or tabernacle dedicated to a completely nonexistent entity represents precisely that (as do its decorations — as we’ll see shortly). On the sides, there are decorations running along the frame. The surface is made of wood, but I’ve embedded magnets inside that allow the images on the sides of the installation to be changed from year to year—or even from day to day. </b> For now, I’ve created some standard geometric patterns, but I thought that"
        - type: image
          image: /assets/images/2026/trad.jpg
          alt: Early Mirademon sketch
    - id: context
      question: "How is it part of your ongoing project experiments at Ozora and your work outside it?"
      blocks:
        - type: text
          content: "This project—Sympathy for the Devil, or as I now more often call it: the Mirademone—is a convergence of my work as an instructor in digital arts, automation, remote monitoring, and programming, and the world of festivals and TAZs. <p> In recent years, I’ve collaborated with various organizations, such as the Istituto Marangoni in Milan and MOME in Budapest, which operate in the field of “immersive digital experiences.” <p> I’ve also done a lot of work integrating small, local AI models into microcontrollers or small computers. Although the topic of AI is highly controversial, these models are (often, and in this installation absolutely) open-source, and they don’t consume much power because they’re embedded within the system. <p> Using some tools from Seeedstudio, I led a workshop on Italian gestures in Budapest this spring, and it was wonderful to show the students from MOME Robotisc how AI is something malleable—not just the control tool it’s becoming. <p> In conclusion, this project is certainly a very interesting case study from both an anthropological and a purely architectural perspective. And I’m doing it for my favorite festival!"

